<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin:0; padding:20px; background:var(--bg-0); }
  .grid { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; }
  .cell { background:var(--bg-1); border:1px solid var(--line-2); border-radius:10px; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--fg-1); }
  .cell svg { width:22px; height:22px; stroke-width:2; }
  .lbl { font-family:var(--font-mono); font-size:9px; color:var(--fg-3); }
  .row { display:flex; gap:14px; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--line-1); color:var(--fg-2); font-family:var(--font-mono); font-size:11px; }
</style></head><body>
  <div class="grid">
    <div class="cell"><i data-lucide="play"></i><div class="lbl">play</div></div>
    <div class="cell"><i data-lucide="pause"></i><div class="lbl">pause</div></div>
    <div class="cell"><i data-lucide="square"></i><div class="lbl">stop</div></div>
    <div class="cell"><i data-lucide="bike"></i><div class="lbl">bike</div></div>
    <div class="cell"><i data-lucide="zap"></i><div class="lbl">power</div></div>
    <div class="cell"><i data-lucide="heart"></i><div class="lbl">hr</div></div>
    <div class="cell"><i data-lucide="gauge"></i><div class="lbl">cadence</div></div>
    <div class="cell"><i data-lucide="bluetooth"></i><div class="lbl">ble</div></div>
    <div class="cell"><i data-lucide="bar-chart-3"></i><div class="lbl">zones</div></div>
    <div class="cell"><i data-lucide="clock"></i><div class="lbl">history</div></div>
    <div class="cell"><i data-lucide="user"></i><div class="lbl">profile</div></div>
    <div class="cell"><i data-lucide="settings"></i><div class="lbl">settings</div></div>
    <div class="cell"><i data-lucide="trophy"></i><div class="lbl">badges</div></div>
    <div class="cell"><i data-lucide="flame"></i><div class="lbl">streak</div></div>
    <div class="cell"><i data-lucide="download"></i><div class="lbl">save</div></div>
    <div class="cell"><i data-lucide="chevron-right"></i><div class="lbl">next</div></div>
  </div>
  <div class="row"><img src="../assets/icon-pulse.svg" style="width:32px;height:32px;color:#F47A1F;filter:drop-shadow(0 0 8px rgba(244,122,31,0.5))" /> <span>Lucide · 24/2px stroke · currentColor &nbsp;·&nbsp; brand glyph (left) is the only custom icon</span></div>
  <script>lucide.createIcons();</script>
</body></html>
