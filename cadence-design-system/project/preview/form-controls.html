<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:var(--bg-0); display:flex; flex-direction:column; gap:14px; }
  label { font-family:var(--font-body); font-size:11px; color:var(--fg-3); text-transform:uppercase; letter-spacing:0.08em; display:block; margin-bottom:6px; }
  input[type=text], select { width:100%; background:var(--bg-1); border:1px solid var(--line-2); color:var(--fg-1); font-family:var(--font-body); font-size:14px; padding:10px 12px; border-radius:10px; box-sizing:border-box; }
  input[type=text]:focus { outline:none; border-color:#F47A1F; box-shadow:0 0 0 2px rgba(244,122,31,0.25); }
  .row { display:flex; gap:12px; align-items:center; }
  .seg { display:inline-flex; background:var(--bg-2); padding:3px; border-radius:999px; border:1px solid var(--line-2); }
  .seg button { background:transparent; border:0; color:var(--fg-2); font-family:var(--font-body); font-weight:500; font-size:13px; padding:6px 14px; border-radius:999px; cursor:pointer; }
  .seg button.on { background:#F47A1F; color:#1a0a00; }
  .switch { width:38px; height:22px; background:var(--bg-3); border-radius:999px; position:relative; }
  .switch.on { background:#F47A1F; }
  .switch::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform 200ms; }
  .switch.on::after { transform:translateX(16px); }
  .check { width:18px; height:18px; border:1.5px solid var(--line-3); border-radius:4px; }
  .check.on { background:#F47A1F; border-color:#F47A1F; }
</style></head><body>
  <div><label>FTP (watts)</label><input type="text" value="248"></div>
  <div class="row"><div style="flex:1"><label>Workout type</label>
    <div class="seg"><button class="on">All</button><button>Endurance</button><button>Threshold</button><button>VO2</button></div>
  </div></div>
  <div class="row" style="gap:24px">
    <div class="row" style="gap:8px"><div class="switch on"></div><span class="t-small">ERG mode</span></div>
    <div class="row" style="gap:8px"><div class="check on"></div><span class="t-small">Auto-save ride file</span></div>
    <div class="row" style="gap:8px"><div class="check"></div><span class="t-small">Sync to cloud</span></div>
  </div>
</body></html>
