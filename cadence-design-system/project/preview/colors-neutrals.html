<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:var(--bg-0); display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  .sw { border-radius:var(--r-sm); padding:14px 12px; border:1px solid var(--line-1); display:flex; flex-direction:column; justify-content:flex-end; height:96px; }
  .name { font-family:var(--font-mono); font-size:11px; color:var(--fg-1); letter-spacing:0.04em; }
  .hex  { font-family:var(--font-mono); font-size:10px; color:var(--fg-3); margin-top:2px; }
  .label { font-family:var(--font-body); font-size:11px; color:var(--fg-2); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:auto; }
</style></head><body>
  <div class="sw" style="background:#0F0C09"><div class="label">bg-0</div><div class="name">#0F0C09</div><div class="hex">app base</div></div>
  <div class="sw" style="background:#181410"><div class="label">bg-1</div><div class="name">#181410</div><div class="hex">cards</div></div>
  <div class="sw" style="background:#221C16"><div class="label">bg-2</div><div class="name">#221C16</div><div class="hex">raised</div></div>
  <div class="sw" style="background:#2D251D"><div class="label">bg-3</div><div class="name">#2D251D</div><div class="hex">hover</div></div>
  <div class="sw" style="background:#3A3025"><div class="label">bg-4</div><div class="name">#3A3025</div><div class="hex">pressed</div></div>
  <div class="sw" style="background:#181410;color:#F4ECDF"><div class="label" style="color:#8A7E6C">fg-1</div><div class="name" style="color:#F4ECDF">#F4ECDF</div><div class="hex">primary</div></div>
  <div class="sw" style="background:#181410"><div class="label">fg-2</div><div class="name" style="color:#C2B5A1">#C2B5A1</div><div class="hex">secondary</div></div>
  <div class="sw" style="background:#181410"><div class="label">fg-3</div><div class="name" style="color:#8A7E6C">#8A7E6C</div><div class="hex">tertiary</div></div>
  <div class="sw" style="background:#181410"><div class="label">fg-4</div><div class="name" style="color:#4F4838">#4F4838</div><div class="hex">disabled</div></div>
  <div class="sw" style="background:#181410;border-color:#3A3025"><div class="label">line-3</div><div class="name" style="color:#C2B5A1">16% wht</div><div class="hex">prominent</div></div>
</body></html>
