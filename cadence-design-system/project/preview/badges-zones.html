<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:var(--bg-0); display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; font-family:var(--font-body); font-weight:600; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; }
  .dot { width:6px; height:6px; border-radius:50%; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background:var(--bg-1); border:1px solid var(--line-2); font-family:var(--font-mono); font-size:11px; color:var(--fg-2); }
</style></head><body>
  <div class="row">
    <span class="badge" style="background:rgba(107,138,168,0.16);color:#9DB1C6"><span class="dot" style="background:#6B8AA8"></span>Z1 Recovery</span>
    <span class="badge" style="background:rgba(46,123,255,0.18);color:#FFAE5C"><span class="dot" style="background:#2E7BFF"></span>Z2 Endurance</span>
    <span class="badge" style="background:rgba(31,179,115,0.18);color:#5DD3A4"><span class="dot" style="background:#1FB373"></span>Z3 Tempo</span>
    <span class="badge" style="background:rgba(240,196,25,0.20);color:#F4D258"><span class="dot" style="background:#F0C419"></span>Z4 Threshold</span>
    <span class="badge" style="background:rgba(255,138,31,0.20);color:#FFAE5C"><span class="dot" style="background:#FF8A1F"></span>Z5 VO2</span>
    <span class="badge" style="background:rgba(235,59,59,0.20);color:#F47272"><span class="dot" style="background:#EB3B3B"></span>Z6 Anaerobic</span>
    <span class="badge" style="background:rgba(197,59,255,0.20);color:#D777FF"><span class="dot" style="background:#C53BFF"></span>Z7 Neuro</span>
  </div>
  <div class="row">
    <span class="pill">52 MIN</span>
    <span class="pill">TSS 65</span>
    <span class="pill">IF 0.91</span>
    <span class="pill" style="color:#F47A1F;border-color:rgba(244,122,31,0.4)">· LIVE</span>
  </div>
</body></html>
