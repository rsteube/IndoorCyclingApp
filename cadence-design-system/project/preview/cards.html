<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:var(--bg-0); display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .card { background:var(--bg-1); border:1px solid var(--line-2); border-radius:12px; padding:18px; }
  .eyebrow { font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--fg-3); text-transform:uppercase; letter-spacing:0.1em; }
  .title { font-family:var(--font-display); font-weight:600; font-size:18px; color:var(--fg-1); margin:6px 0 4px; letter-spacing:-0.01em; }
  .meta { font-family:var(--font-body); font-size:12px; color:var(--fg-3); margin-bottom:14px; }
  .bar { display:flex; height:6px; border-radius:999px; overflow:hidden; gap:1px; background:var(--bg-0); }
  .bar > div { height:100%; }
  .stats { display:flex; gap:18px; margin-top:12px; }
  .stat { font-family:var(--font-mono); font-size:11px; color:var(--fg-2); }
  .stat b { font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--fg-1); display:block; }
</style></head><body>
  <div class="card">
    <div class="eyebrow">Threshold</div>
    <div class="title">Sweet Spot 3×12</div>
    <div class="meta">52 min · TSS 65 · IF 0.91</div>
    <div class="bar">
      <div style="background:#2E7BFF;flex:1"></div>
      <div style="background:#1FB373;flex:3"></div>
      <div style="background:#F0C419;flex:5"></div>
      <div style="background:#1FB373;flex:1"></div>
      <div style="background:#F0C419;flex:5"></div>
      <div style="background:#1FB373;flex:1"></div>
      <div style="background:#F0C419;flex:5"></div>
      <div style="background:#2E7BFF;flex:1"></div>
    </div>
  </div>
  <div class="card">
    <div class="eyebrow">VO2 Max</div>
    <div class="title">30/30s · 8 sets</div>
    <div class="meta">38 min · TSS 58 · IF 0.94</div>
    <div class="bar">
      <div style="background:#2E7BFF;flex:2"></div>
      <div style="background:#FF8A1F;flex:1"></div><div style="background:#1FB373;flex:1"></div>
      <div style="background:#FF8A1F;flex:1"></div><div style="background:#1FB373;flex:1"></div>
      <div style="background:#FF8A1F;flex:1"></div><div style="background:#1FB373;flex:1"></div>
      <div style="background:#FF8A1F;flex:1"></div><div style="background:#1FB373;flex:1"></div>
      <div style="background:#2E7BFF;flex:2"></div>
    </div>
    <div class="stats">
      <div class="stat"><b>225</b>avg W</div>
      <div class="stat"><b>92</b>avg rpm</div>
    </div>
  </div>
</body></html>
