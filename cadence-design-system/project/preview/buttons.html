<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:var(--bg-0); display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .meta { font-family:var(--font-mono); font-size:10px; color:var(--fg-3); width:90px; flex:none; text-transform:uppercase; letter-spacing:0.08em; }
  button { font-family:var(--font-body); font-weight:600; font-size:14px; padding:10px 18px; border-radius:12px; border:0; cursor:pointer; line-height:1; display:inline-flex; align-items:center; gap:8px; }
  .b-primary { background:#F47A1F; color:#1a0a00; box-shadow:0 0 0 1px rgba(244,122,31,0.5),0 0 24px rgba(244,122,31,0.3); }
  .b-secondary { background:var(--bg-2); color:var(--fg-1); border:1px solid var(--line-2); }
  .b-ghost { background:transparent; color:var(--fg-1); border:1px solid var(--line-2); }
  .b-danger { background:transparent; color:#EB3B3B; border:1px solid rgba(235,59,59,0.4); }
  .b-disabled { background:var(--bg-2); color:var(--fg-4); }
  .b-sm { padding:6px 12px; font-size:13px; border-radius:8px; }
  .b-lg { padding:14px 22px; font-size:16px; border-radius:14px; }
</style></head><body>
  <div class="row"><div class="meta">Primary</div>
    <button class="b-primary">Start workout</button>
    <button class="b-secondary">Pause</button>
    <button class="b-ghost">Cancel</button>
    <button class="b-danger">End ride</button>
    <button class="b-disabled" disabled>Connect trainer</button>
  </div>
  <div class="row"><div class="meta">Sizes</div>
    <button class="b-primary b-sm">Small</button>
    <button class="b-primary">Default</button>
    <button class="b-primary b-lg">Large</button>
  </div>
</body></html>
