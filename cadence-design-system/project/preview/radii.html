<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background:var(--bg-0); display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
  .box { background:var(--bg-2); border:1px solid var(--line-2); height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
  .name { font-family:var(--font-mono); font-size:11px; color:var(--fg-1); letter-spacing:0.04em; }
  .px { font-family:var(--font-mono); font-size:10px; color:var(--fg-3); }
</style></head><body>
  <div class="box" style="border-radius:4px"><div class="name">r-xs</div><div class="px">4 px</div></div>
  <div class="box" style="border-radius:8px"><div class="name">r-sm</div><div class="px">8 px</div></div>
  <div class="box" style="border-radius:12px"><div class="name">r-md</div><div class="px">12 · default</div></div>
  <div class="box" style="border-radius:16px"><div class="name">r-lg</div><div class="px">16 px</div></div>
  <div class="box" style="border-radius:24px"><div class="name">r-xl</div><div class="px">24 px</div></div>
  <div class="box" style="border-radius:999px"><div class="name">r-pill</div><div class="px">∞</div></div>
</body></html>
