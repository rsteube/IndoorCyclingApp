<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Indoor Bike App - Android UI Kit</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    body { margin: 0; background: radial-gradient(ellipse at top, #181410 0%, #0F0C09 70%); min-height: 100vh; font-family: var(--font-body); color: var(--fg-1); }
    .header { padding: 36px 40px 8px; display: flex; align-items: center; gap: 16px; }
    .header img { width: 38px; height: 38px; }
    .header h1 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; letter-spacing: -0.01em; }
    .header .sub { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.12em; margin-left: auto; }
    .stage { display: flex; gap: 32px; padding: 24px 40px 60px; align-items: flex-start; overflow-x: auto; }
    .col { display: flex; flex-direction: column; align-items: center; gap: 14px; flex-shrink: 0; }
    .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); text-transform: uppercase; letter-spacing: 0.12em; }
    .controls { display: flex; gap: 8px; padding: 0 40px 16px; flex-wrap: wrap; }
    .controls button { background: var(--bg-2); border: 1px solid var(--line-2); color: var(--fg-2); font-family: var(--font-body); font-weight: 600; font-size: 12px; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
    .controls button.on { background: var(--brand-500); color: #1a0a00; border-color: transparent; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="header">
    <img src="../../assets/logo-mark.svg">
    <h1>Indoor Bike App</h1>
    <div class="sub">UI Kit · v0.1</div>
  </div>
  <div class="controls" id="ctrls"></div>
  <div id="root"></div>

  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="WorkoutScreens.jsx"></script>
  <script type="text/babel" src="RideScreens.jsx"></script>

  <script type="text/babel">
    const sample = {
      id: 'sweet', title: 'Sweet Spot 3×12', tag: 'Threshold', dur: '52 min', tss: 65, if: 0.91,
      segs: [{zone:2,weight:2},{zone:3,weight:1},{zone:4,weight:5},{zone:3,weight:1},{zone:4,weight:5},{zone:3,weight:1},{zone:4,weight:5},{zone:2,weight:1}]
    };

    function App() {
      const [view, setView] = React.useState('all');
      const [picked, setPicked] = React.useState(sample);
      React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [view]);

      const Wrap = ({children, label}) => (
        <div className="col">
          <IBDevice>{children}</IBDevice>
          <div className="label">{label}</div>
        </div>
      );

      // Render mode buttons
      const modes = [
        { id: 'all', label: 'All screens' },
        { id: 'list', label: 'Workout list' },
        { id: 'detail', label: 'Detail' },
        { id: 'ride', label: 'In-ride HUD' },
        { id: 'summary', label: 'Summary' },
        { id: 'progress', label: 'Progress' },
      ];

      React.useEffect(() => {
        const c = document.getElementById('ctrls');
        c.innerHTML = '';
        modes.forEach(m => {
          const b = document.createElement('button');
          b.textContent = m.label;
          if (view === m.id) b.className = 'on';
          b.onclick = () => setView(m.id);
          c.appendChild(b);
        });
      }, [view]);

      const onPick = w => { setPicked(w); setView('detail'); };
      const onStart = () => setView('ride');
      const onEnd = () => setView('summary');
      const onDone = () => setView('list');
      const onTab = id => { if (id === 'progress') setView('progress'); else setView('list'); };

      if (view === 'list')     return <div className="stage"><Wrap label="01 · Workout list"><WorkoutListScreen onPick={onPick} onTab={onTab} /></Wrap></div>;
      if (view === 'detail')   return <div className="stage"><Wrap label="02 · Workout detail"><WorkoutDetailScreen workout={picked} onBack={() => setView('list')} onStart={onStart} /></Wrap></div>;
      if (view === 'ride')     return <div className="stage"><Wrap label="03 · In-ride HUD"><RideScreen workout={picked} onEnd={onEnd} /></Wrap></div>;
      if (view === 'summary')  return <div className="stage"><Wrap label="04 · Ride summary"><SummaryScreen onDone={onDone} /></Wrap></div>;
      if (view === 'progress') return <div className="stage"><Wrap label="05 · Progress"><ProgressScreen onTab={onTab} /></Wrap></div>;

      // 'all' - show all five
      return (
        <div className="stage">
          <Wrap label="01 · Workout list"><WorkoutListScreen onPick={onPick} onTab={onTab} /></Wrap>
          <Wrap label="02 · Detail"><WorkoutDetailScreen workout={picked} onBack={() => setView('list')} onStart={onStart} /></Wrap>
          <Wrap label="03 · In-ride HUD"><RideScreen workout={picked} onEnd={onEnd} /></Wrap>
          <Wrap label="04 · Summary"><SummaryScreen onDone={onDone} /></Wrap>
          <Wrap label="05 · Progress"><ProgressScreen onTab={onTab} /></Wrap>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
