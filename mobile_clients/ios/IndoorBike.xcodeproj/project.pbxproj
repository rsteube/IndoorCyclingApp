			shellScript = "# Builds :shared for the SDK and configuration Xcode is building, and puts\n# the framework where FRAMEWORK_SEARCH_PATHS looks for it.\nif ! java -version >/dev/null 2>&1 && [ -n \"$SHELL\" ]; then\n  login_path=$(\"$SHELL\" -lc 'printf %s \"$PATH\"')\n  export PATH=\"$login_path:$PATH\"\nfi\nif [ -z \"$JAVA_HOME\" ] && [ -n \"$SHELL\" ]; then\n  login_java_home=$(\"$SHELL\" -lc 'printf %s \"${JAVA_HOME:-}\"')\n  [ -n \"$login_java_home\" ] && export JAVA_HOME=\"$login_java_home\"\nfi\nif ! java -version >/dev/null 2>&1; then\n  OLD_IFS=$IFS\n  IFS=:; for dir in $PATH; do\n    if [ -x \"$dir/java\" ] && \"$dir/java\" -version >/dev/null 2>&1; then\n      export PATH=\"$dir:$PATH\"\n      break\n    fi\n  done; IFS=$OLD_IFS\nfi\nif ! java -version >/dev/null 2>&1 && command -v brew >/dev/null 2>&1; then\n  java_bin_dir=$(brew list --formula | grep '^openjdk' | sort -Vr | while read formula; do\n    prefix=$(brew --prefix \"$formula\") || continue\n    if [ -x \"$prefix/bin/java\" ] && \"$prefix/bin/java\" -version >/dev/null 2>&1; then\n      printf %s \"$prefix/bin\"\n      break\n    fi\n  done)\n  [ -n \"$java_bin_dir\" ] && export PATH=\"$java_bin_dir:$PATH\"\nfi\nif ! java -version >/dev/null 2>&1; then\n  echo \"JDK not found. Install a JDK or set JAVA_HOME before building from Xcode.\" >&2\n  exit 1\nfi\ncd \"$SRCROOT/../..\"\n./gradlew :shared:embedAndSignAppleFrameworkForXcode\n";
