org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.mpp.enableCInteropCommonization=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# Play's own analysis of the bundle asks for this, and it takes about 400 KB
# off the APK. Left at the AGP 8 default by the upgrade to AGP 9 rather than by
# a decision.
#
# Safe here because the shrinker only removes what it cannot see referenced,
# and the one library in this app that looks a resource up by name is osmdroid,
# in `BasicInfoWindow`, the marker bubble: nothing here draws a marker. Checked
# by grepping osmdroid's own classes for `getIdentifier`, which is the question
# to ask again if another View-based library is ever added.
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false

