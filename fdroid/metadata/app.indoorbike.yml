AutoName: Indoor Bike

Summary: Local-first indoor cycling for FTMS smart trainers in ERG mode

Description: |-
    Indoor Bike connects to your smart trainer over standard BLE FTMS, runs
    structured power-zone workouts in ERG mode, and saves rides on your phone
    as files. No accounts, no subscriptions, no cloud required.

    Features:

    * BLE smart-trainer control — Wahoo Kickr Core is the first-class target;
      any FTMS-compatible trainer should work. Optional pairing for a
      Bluetooth heart-rate monitor and a Zwift Click controller.
    * ERG mode — the app drives the trainer to each interval's target wattage
      automatically. You hold cadence, it holds watts.
    * Plain-text JSON workouts — readable, hand-editable, shareable. Ships
      with a starter pack; import your own via file pick, share-sheet, QR
      code from the browser editor, or by URL.
    * Local progression — streaks, rider levels, badges, week-grouped ride
      history, and time-in-zone, all computed on-device from saved rides.
    * Optional folder-based backup &amp; cross-device sync. Pick any folder
      your phone can reach (Drive, Dropbox, Nextcloud, Syncthing, OneDrive,
      …) and the app writes a small JSON slice there. Other devices pointed
      at the same folder share rides, library, and settings. No accounts, no
      central server.
    * FIT export and optional Intervals.icu sync. Strict opt-in — manual
      upload from the post-ride screen, or auto-upload after a ride. The app
      makes zero outbound network calls until you configure credentials.
    * F-Droid posture — no Google Play Services, no analytics, no crash
      reporters, no proprietary blobs. Bundled fonts ship as OFL TTFs.

    The companion website at https://indoorbike.app hosts a browser-based
    workout editor that produces QR codes the in-app scanner imports
    locally — no backend round-trip.

# ---------------------------------------------------------------------------
# Anti-features
# ---------------------------------------------------------------------------
# Documented per F-Droid's policy. Both flags below describe optional
# capabilities — the app is fully functional without either, and never
# triggers the relevant code path on a fresh install with default settings.
AntiFeatures:
  NonFreeNet:
    en-US: |-
      The app supports an optional integration with Intervals.icu, a non-free
      cycling-analytics SaaS. The integration is off by default and the app
      makes zero contact with intervals.icu until the rider explicitly enters
      their athlete ID + API key in Settings → Cloud Sync and either taps
      Upload on a finished ride or enables auto-upload. The Intervals.icu API
      key is also excluded from Android Auto Backup so it never leaves the
      device implicitly.

      No other non-free network services are contacted. The community
      workout-repository registry is hosted on Codeberg (free software:
      Forgejo) at the same source-code repository as the app, and is fetched
      lazily only when the rider opens "More Workouts → Browse community".

