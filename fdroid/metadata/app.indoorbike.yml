# F-Droid metadata for Indoor Bike (`app.indoorbike`).
#
# This file is the source of truth for the entry that lives in F-Droid's
# fdroiddata repository at `metadata/app.indoorbike.yml`. Keep them in sync
# when submitting updates: copy this file into a fdroiddata fork, open a
# merge request in https://gitlab.com/fdroid/fdroiddata, and follow their
# review checklist (see `fdroid/README.md` for the workflow).

Categories:
  - Sports & Health
License: GPL-3.0-only

AuthorName: Juhani Lehtimäki
WebSite: https://indoorbike.app
SourceCode: https://codeberg.org/juhanilehtimaki/IndoorCyclingApp
IssueTracker: https://codeberg.org/juhanilehtimaki/IndoorCyclingApp/issues

AutoName: Indoor Bike

# Summary and Description are NOT in the YAML — they live in the per-locale
# file tree at `metadata/app.indoorbike/en-US/{short,full}_description.txt`.
# F-Droid's `make-summary-translatable.py` tooling auto-migrates `Summary:`
# / `Description:` from the YAML into that tree and then `git diff
# --exit-code` fails the MR pipeline because the migration produced
# uncommitted changes. We pre-do the migration so the pipeline stays clean.

# ---------------------------------------------------------------------------
# Anti-features
# ---------------------------------------------------------------------------
# Documented per F-Droid's policy. Both flags below describe optional
# capabilities — the app is fully functional without either, and never
# triggers the relevant code path on a fresh install with default settings.
AntiFeatures:
  NonFreeNet:
    en-US: |-
      The app supports an optional integration with Intervals.icu, a non-free
      cycling-analytics SaaS. The integration is off by default and the app
      makes zero contact with intervals.icu until the rider explicitly enters
      their athlete ID + API key in Settings → Cloud Sync and either taps
      Upload on a finished ride or enables auto-upload. The Intervals.icu API
      key is also excluded from Android Auto Backup so it never leaves the
      device implicitly.

      No other non-free network services are contacted. The community
      workout-repository registry is hosted on Codeberg (free software:
      Forgejo) at the same source-code repository as the app, and is fetched
      lazily only when the rider opens "More Workouts → Browse community".

# ---------------------------------------------------------------------------
# Repo + builds
# ---------------------------------------------------------------------------
RepoType: git
Repo: https://codeberg.org/juhanilehtimaki/IndoorCyclingApp.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    # Full 40-char Git commit SHA of the v1.0 release commit on Codeberg.
    # F-Droid maintainers reject branch names ("main") or tag names ("v1.0")
    # here — the recipe must pin a specific commit for reproducibility.
    # Re-derive after each release with `git rev-parse v<version>` and
    # paste below.
    commit: 01ca8d2c7cef30a2d29accec4e806634d2c2e4b5
    # The Android app module sits in a non-standard subdirectory because
    # this is a multi-module Kotlin Multiplatform project. F-Droid runs
    # gradle from this path; the gradle wrapper at the repo root is
    # picked up via the standard Android build classpath.
    subdir: mobile_clients/android
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.0'
CurrentVersionCode: 1
