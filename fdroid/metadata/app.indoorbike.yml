RepoType: git
Repo: https://codeberg.org/juhanilehtimaki/IndoorCyclingApp.git

Builds:
  - versionName: '1.0'
    versionCode: 1
    # TODO: replace with the git tag (or commit hash) of the v1.0 release
    # before submitting. F-Droid pins each build to a specific commit so
    # successive builds are reproducible.
    commit: v1.0
    # The Android app module lives in a subdirectory of the multi-module
    # repo. The gradle wrapper at the repo root is used to invoke the
    # build; this entry just tells F-Droid where the app's build.gradle
    # is for version-extraction purposes.
    subdir: mobile_clients/android
    gradle:
      - yes

AutoUpdateMode: Version
UpdateCheckMode: Tags
